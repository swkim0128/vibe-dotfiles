# 공통 설치 목록. profiles/<mode>.conf에서 배열을 재정의해 설치 범위를 조정한다.
BREW_FILES=(Brewfile)
NPM_FILES=(npm-globals.txt)
NPM_PROJECTS=(vibe-tools/php-format)
UV_FILES=(uv-tools.txt)
INSTALL_STEPS=(
  homebrew
  brew_packages
  npm_packages
  mise_config
  uv_tools
  catchtype
  oh_my_zsh
  zinit
  gui_config
  tmux_tpm
  tmux_config
  herdr_config
  hammerspoon_config
  vibe_tools
  nvim_config
  helix_config
  ai_notice
  shell_config
  git_delta
  git_ignore
  glow_config
  tmux_reload
)
CONFIG_LINKS=(
  "gui_config|.config/ghostty/config|ghostty/config"
  "gui_config|.config/cmux/cmux.json|cmux/cmux.json"
  "tmux_config|.tmux.conf|tmux/.tmux.conf"
  "tmux_config|.config/bin/dock-badges.sh|bin/dock-badges.sh"
  "tmux_config|.config/bin/dock-badges-poll.sh|bin/dock-badges-poll.sh"
  "herdr_config|.config/herdr/config.toml|herdr/config.toml"
  "herdr_config|.config/herdr/status.py|herdr/status.py"
  "herdr_config|.config/herdr/vibe-herdr|herdr/runtime/target/release/vibe-herdr"
  "herdr_config|.config/herdr/hud.py|herdr/hud.py"
  "herdr_config|.config/bin/dock-badges.sh|bin/dock-badges.sh"
  "hammerspoon_config|.hammerspoon/init.lua|hammerspoon/init.lua"
  "hammerspoon_config|.hammerspoon/herdr-alert.lua|hammerspoon/herdr-alert.lua"
  "hammerspoon_config|.hammerspoon/herdr-alert.json|hammerspoon/herdr-alert.json"
  "vibe_tools|.config/vibe-tools|vibe-tools"
  "nvim_config|.config/nvim/lua|nvim/lua"
  "helix_config|.config/helix/config.toml|helix/config.toml"
  "helix_config|.config/helix/themes/catppuccin_mocha_terminal.toml|helix/themes/catppuccin_mocha_terminal.toml"
  "mise_config|.config/mise/config.toml|mise/config.toml"
