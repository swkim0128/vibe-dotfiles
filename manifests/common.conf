# 공통 설치 목록. profiles/<mode>.conf에서 배열을 재정의해 설치 범위를 조정한다.
BREW_FILES=(Brewfile)
NPM_FILES=(npm-globals.txt)
UV_FILES=(uv-tools.txt)
INSTALL_STEPS=(
  homebrew
  brew_packages
  npm_packages
  uv_tools
  catchtype
  oh_my_zsh
  zinit
  gui_config
  tmux_tpm
  tmux_config
  vibe_tools
  nvim_config
  mise_config
  ai_notice
  shell_config
  git_delta
  git_ignore
  glow_config
  tmux_reload
)
CONFIG_LINKS=(
  "gui_config|.config/ghostty/config|ghostty/config"
  "gui_config|.config/cmux/cmux.json|cmux/cmux.json"
  "tmux_config|.tmux.conf|tmux/.tmux.conf"
  "vibe_tools|.config/vibe-tools|vibe-tools"
  "nvim_config|.config/nvim/lua|nvim/lua"
  "mise_config|.config/mise/config.toml|mise/config.toml"
  "git_ignore|.gitignore_global|git/gitignore_global"
  "glow_config|Library/Preferences/glow/glow.yml|glow/glow.yml"
  "glow_config|Library/Preferences/glow/catppuccin-macchiato.json|glow/catppuccin-macchiato.json"
)
