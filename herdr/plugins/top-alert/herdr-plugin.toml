id = "vibe.top-alert"
name = "Herdr Top Alert"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Show local Hammerspoon alerts when an agent finishes or needs input."
platforms = ["macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["../../runtime/target/release/vibe-herdr", "notify"]

[[actions]]
id = "bar"
title = "하단 상태 TUI 고정"
command = ["../../runtime/target/release/vibe-herdr", "bar", "ensure", "--current", "--parent-current"]

[[actions]]
id = "test"
title = "Test top-center alert"
command = ["../../runtime/target/release/vibe-herdr", "notify", "--test", "blocked"]

[[panes]]
id = "tui"
title = "현재 상태 · TUI"
placement = "tab"
command = ["../../runtime/target/release/vibe-herdr", "view"]

[[panes]]
id = "popup"
title = "현재 상태 · 팝업"
placement = "popup"
width = 68
height = 16
command = ["../../runtime/target/release/vibe-herdr", "view"]
