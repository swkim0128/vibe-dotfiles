onboarding = false

[terminal]
new_cwd = "follow"

[keys]
prefix = ["ctrl+b", "ctrl+space"]

[ui]
confirm_close = true
tab_bar_position = "bottom"
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = "command", command = "python3 -B ~/.config/herdr/status.py", interval_seconds = 5, timeout_seconds = 4 },
  { type = "command", command = "python3 -B ~/.config/herdr/status.py --usage", interval_seconds = 60, timeout_seconds = 10 },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "agent", "state_text"],
  ["workspace", "tab", "pane"],
  ["$hud"],
]

[ui.sidebar.spaces]
rows = [["workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false
