onboarding = false

[terminal]
new_cwd = "follow"

[keys]
prefix = ["ctrl+b", "ctrl+space"]
previous_workspace = "prefix+["
next_workspace = "prefix+]"
focus_pane_left = ["prefix+h", "prefix+ㅗ"]
focus_pane_down = ["prefix+j", "prefix+ㅓ"]
focus_pane_up = ["prefix+k", "prefix+ㅏ"]
focus_pane_right = ["prefix+l", "prefix+ㅣ"]
split_vertical = ["prefix+v", "prefix+ㅍ"]
navigate_pane_left = ["h", "ㅗ"]
navigate_pane_down = ["j", "ㅓ"]
navigate_pane_up = ["k", "ㅏ"]
navigate_pane_right = ["l", "ㅣ"]

[experimental]
switch_ascii_input_source_in_prefix = true

[ui]
confirm_close = true
pane_borders = "always"
pane_outer_borders = true
tab_bar_position = "bottom"
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = "command", command = "python3 -B ~/.config/herdr/status.py", interval_seconds = 5, timeout_seconds = 4 },
  { type = "datetime", format = "%Y-%m-%d %H:%M" },
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "agent", "state_text"],
  ["workspace", "tab", "pane"],
  ["$project_path"],
  ["$hud"],
]

[ui.sidebar.spaces]
rows = [["workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false
